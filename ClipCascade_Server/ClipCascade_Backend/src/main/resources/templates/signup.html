<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
  <head>
    <title>ClipCascade - Create Account</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg" />
    <link href="/assets/css/bootstrap@4.0.0.min.css" rel="stylesheet" />
    <style>
      .form-signup {
        max-width: 330px;
        padding: 15px;
        margin: auto;
        margin-top: 10%;
      }

      .form-signup-heading {
        font-size: 1.75rem;
      }

      .app-title {
        text-align: center;
        margin-top: 20px;
        font-size: 34px;
        font-weight: bold;
      }

      .captcha-container {
        display: flex;
        align-items: center;
        justify-content: flex-start;
      }

      .captcha-image-container {
        margin-right: 10px;
      }

      .captcha-reload-btn {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        margin-left: 10px;
      }

      #captchaInput {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="app-title">
        <a href="/login" style="text-decoration: none; color: inherit"
          >ClipCascade</a
        >
      </div>
      <form
        class="form-signup"
        id="signupForm"
        th:action="@{/signup}"
        method="post"
      >
        <h2 class="form-signup-heading">Create an Account</h2>
        <div id="errorDiv" class="alert alert-danger" style="display: none">
          Registration error. Please try again.
        </div>
        <p>
          <label for="username" class="sr-only">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            class="form-control"
            placeholder="Username"
            required="required"
            autofocus="autofocus"
            minlength="4"
            maxlength="200"
          />
        </p>
        <p>
          <label for="password" class="sr-only">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Password"
            required="required"
            minlength="8"
            maxlength="200"
            pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).*$"
            title="Password must contain at least one lowercase letter, one uppercase letter, and one digit."
          />
        </p>
        <p>
          <label for="confirmPassword" class="sr-only">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            class="form-control"
            placeholder="Confirm Password"
            required="required"
            minlength="8"
            maxlength="200"
          />
        </p>
        <div class="captcha-container">
          <div class="captcha-image-container">
            <img id="captchaImage" src="/captcha" alt="Captcha Image" />
          </div>
          <button
            type="button"
            class="captcha-reload-btn"
            id="refresh-captcha-btn"
          >
            &#x21bb;
          </button>
        </div>
        <input
          type="text"
          id="captchaInput"
          name="captchaInput"
          class="form-control"
          placeholder="Enter captcha"
          required
          maxlength="6"
          autocomplete="off"
        />
        <br /><br />
        <button class="btn btn-lg btn-primary btn-block" type="submit">
          Sign Up
        </button>
      </form>
    </div>

    <!-- js-sha3 library (CDN) -->
    <script src="/assets/js/sha3.min.js"></script>

    <script src="/assets/js/signup.js"></script>
  </body>
</html>
