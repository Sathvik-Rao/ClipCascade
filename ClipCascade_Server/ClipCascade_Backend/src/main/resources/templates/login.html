<!DOCTYPE html>
<html
  lang="en"
  xmlns="http://www.w3.org/1999/xhtml"
  xmlns:th="https://www.thymeleaf.org"
>
  <head>
    <!-- Apply the saved or system theme before the page is painted. -->
    <script src="/assets/js/theme.js"></script>
    <link rel="manifest" href="/assets/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
    <meta name="theme-color" content="#2866c4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ClipCascade" />
    <title>ClipCascade - Please Log In</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      name="description"
      content="ClipCascade Login Page - Securely sign in to access your account on ClipCascade, a platform for managing and sharing your clipboard history."
    />
    <meta
      name="keywords"
      content="ClipCascade, clipboard sync, secure clipboard, multi-device clipboard, end-to-end encryption, Windows clipboard sync, Mac clipboard sync, Linux clipboard sync, Android clipboard sync, Docker clipboard app"
    />
    <link rel="icon" type="image/png" href="/assets/images/logo.png" />
    <link href="/assets/css/bootstrap@4.0.0.min.css" rel="stylesheet" />
    <style>
      .form-signin {
        max-width: 330px;
        padding: 15px;
        margin: auto;
        margin-top: 10%;
      }
      .form-signin-heading {
        /* text-align: center; */
        font-size: 1.75rem;
      }
      .app-title {
        text-align: center;
        margin-top: 20px;
        font-size: 34px;
        font-weight: bold;
      }
      .footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background-color: #f8f9fa;
        text-align: center;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
        box-shadow: 0 -1px 5px rgba(0, 0, 0, 0.1);
      }
      .footer-left-container,
      .footer-right-container {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .footer-middle-container {
        display: flex;
        justify-content: center;
        gap: 15px;
        flex-grow: 1;
      }
      .footer-left-container a,
      .footer-right-container a {
        color: #007bff;
        margin-right: 10px;
        text-decoration: none;
      }
      .footer-left-container a:last-of-type,
      .footer-right-container a:last-of-type {
        margin-right: 0;
      }
      .footer-left-container a:hover,
      .footer-right-container a:hover {
        text-decoration: underline;
      }
      .footer-middle-container a img {
        margin: 0 10px;
        height: 24px;
      }
      .footer-right-container {
        font-size: 10px;
        color: #bbb;
        cursor: default;
        user-select: none;
      }
    </style>
    <link rel="stylesheet" href="/assets/css/theme.css" />
    <link rel="stylesheet" href="/assets/css/responsive.css" />
  </head>
  <body class="auth-page login-page">
    <div class="theme-corner"><button type="button" id="theme-toggle" class="theme-toggle" role="switch"
        aria-label="Dark mode" aria-checked="false" title="Switch to dark mode">
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5" />
        </svg>
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z" />
        </svg>
      </button></div>
    <div class="container">
      <header>
        <div class="app-title">ClipCascade</div>
      </header>
      <form
        class="form-signin"
        id="loginForm"
        action="/login"
        th:action="@{/login}"
        method="post"
      >
        <h2 class="form-signin-heading">Please sign in</h2>
        <div th:if="${param.error}" class="alert alert-danger">
          <!-- Don't change this error message -->
          Bad credentials
        </div>
        <div th:if="${param.logout}" class="alert alert-success">
          You have been signed out
        </div>
        <div th:if="${param.expired}" class="alert alert-warning">
          Your session has expired
        </div>
        <div th:if="${param.registered}" class="alert alert-success">
          You have successfully registered
        </div>
        <p>
          <label for="username" class="sr-only">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            class="form-control"
            placeholder="Username"
            required="required"
            autofocus="autofocus"
          />
        </p>
        <p>
          <label for="password" class="sr-only">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            class="form-control"
            placeholder="Password"
            required="required"
          />
        </p>
        <button class="btn btn-lg btn-primary btn-block" type="submit">
          Sign in
        </button>
      </form>

      <div class="text-center mt-3" th:if="${signupEnabled}">
        <a href="/signup">Create an account</a>
      </div>
    </div>

      <!-- Footer -->
      <div class="footer">
        <div class="footer-left-container">
          <a href="/help" target="_blank" rel="noopener noreferrer">Help</a>
          <a
            th:if="${donationsEnabled}"
            href="/donate"
            target="_blank"
            rel="noopener noreferrer"
            >Donate</a
          >
        </div>
        <div class="footer-middle-container">
          <a
            href="https://github.com/Sathvik-Rao/ClipCascade/releases"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="/assets/images/windows.png" alt="Download for Windows" />
          </a>
          <a
            href="https://github.com/Sathvik-Rao/ClipCascade/releases"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="/assets/images/apple.png" alt="Download for Apple" />
          </a>
          <a
            href="https://github.com/Sathvik-Rao/ClipCascade/releases"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="/assets/images/linux.png" alt="Download for Linux" />
          </a>
          <a
            href="https://github.com/Sathvik-Rao/ClipCascade/releases"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="/assets/images/android.png" alt="Download for Android" />
          </a>
          <a
            href="https://hub.docker.com/r/sathvikrao/clipcascade"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="/assets/images/docker.png" alt="Docker Hub" />
          </a>
          <a
            href="https://github.com/Sathvik-Rao/ClipCascade"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img src="/assets/images/github.png" alt="GitHub Repository" />
          </a>
        </div>
        <div class="footer-right-container">
          <span>Brute-Force Protected</span>
        </div>
      </div>

    <!-- js-sha3 library (CDN) -->
    <script src="/assets/js/sha3.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const loginForm = document.getElementById("loginForm");
        const passwordField = document.getElementById("password");

        loginForm.addEventListener("formdata", function (event) {
          // Keep the entered password available to password managers while
          // preserving the server's SHA3-512 password protocol on submission.
          event.formData.set("password", sha3_512(passwordField.value));
        });
      });
    </script>
  </body>
</html>
